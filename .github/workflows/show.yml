name: Show source
on: [push, workflow_dispatch]
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for z in *.zip; do unzip -oq "$z"; done
          D=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          H="$D/app/src/main/assets/index.html"
          {
            echo '### index.html (without embedded font)'
            echo '~~~html'
            sed -E 's/base64,[A-Za-z0-9+\/=]{200,}/base64,REMOVED/g' "$H"
            echo '~~~'
          } >> $GITHUB_STEP_SUMMARY
