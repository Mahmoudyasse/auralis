name: Show source
on: [push, workflow_dispatch]
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for z in *.zip; do unzip -oq "$z"; done
          D=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          {
            echo '### MainActivity.kt'
            echo '~~~kotlin'
            cat "$D/app/src/main/java/com/auralis/browser/MainActivity.kt"
            echo '~~~'
            echo '### index.html'
            echo '~~~html'
            cat "$D/app/src/main/assets/index.html"
            echo '~~~'
          } >> $GITHUB_STEP_SUMMARY
