            panel('<h2>🏆 Usage</h2><div class="li"><div>Browsing today</div><b>'+Math.round(tot/60)+' min</b></div><h3>Top sites (14 days)</h3>'+(top.map(([h,s])=>`<div class="li"><div>${esc(h)}</div><b>${Math.round(s/60)} min</b></div>`).join('')||'<small>Not enough data yet</small>')+'<h3>Achievements</h3>'+B.map(([n,dsc,ok])=>`<div class="li" style="opacity:${ok?1:.45}"><div>${n}<small>${dsc}</small></div><b>${ok?'✓':'—'}</b></div>`).join(''))}
          function moreP(){const dev=window.Native&&Native.keepOn;
            panel('<h2>⚙ More settings</h2><h3>Browsing</h3>'+tg('pb','📊 Reading progress bar')+tg('utm','🧼 Clean tracking links (utm, fbclid…)')+tg('phish','⚠ Suspicious address warning')+'<h3>Appearance</h3>'+tg('adark','🌙 Auto dark mode (7pm–6am)')+tg('sbot','👍 Search at bottom (one-hand)')+tg('nodl','⤓ Hide download button in dock')+'<div style="margin-top:8px">Font</div>'+seg('uf',[['def','Default'],['sys','System'],['ser','Serif'],['mon','Mono']])+'<h3>History</h3><div>Auto-delete after (days)</div>'+seg('hd',[[0,'Never'],[7,'7'],[30,'30'],[90,'90']])+'<h3>Export</h3><div class="seg"><button data-a4="exbm">Bookmarks (HTML)</button><button data-a4="exhi">History (CSV)</button></div>'+(dev?'<h3>Device</h3>'+tg('wifi','📶 Download on Wi-Fi only')+tg('nopop','🚫 Block pop-ups')+tg('noauto','⏸ Block video autoplay')+tg('keep','💡 Keep screen on')+tg('vol','🔊 Volume keys scroll')+tg('imm','⛶ Fullscreen (hide system bars)')+tg('sec','🙈 Block screenshots')+'<div style="margin-top:8px">Orientation</div>'+seg('ori',[['auto','Auto'],['por','Portrait'],['lan','Landscape']])+'<div class="seg" style="margin-top:10px"><button data-a4="cc">Clear cache</button><button data-a4="ck">Clear all cookies</button><button data-a4="cs">Clear this site cookies</button></div>':'<small>Device settings need the newest build stage.</small>'))}
          async function outline(){const r=await ask(pgHeads);panel('<h2>📑 Outline</h2>'+((r&&r.length)?r.map(([t,x,i])=>`<div class="li" data-a4="hd_${i}" style="padding-left:${t==='H1'?12:t==='H2'?24:36}px"><div>${esc(x)}</div></div>`).join(''):'<small>No headings found on this page</small>'))}
