          h='@JavascriptInterface fun hide() = runOnUiThread { web.visibility = View.GONE }'
          rep(h,h+'\n'+BRIDGE)
          rep('r.setMimeType(mime); r.addRequestHeader("User-Agent", ua)','r.setMimeType(mime); r.addRequestHeader("User-Agent", ua)\n            if (prefs().getBoolean("wifi", false)) r.setAllowedNetworkTypes(DownloadManager.Request.NETWORK_WIFI)')
          rep('private fun nav(url: String, title: String) {',KEY+'\n    private fun nav(url: String, title: String) {')
          open(k,'w',encoding='utf-8').write(t)
          print('stage5 ok')
          PYEOF
          grep -q "fun volScroll" "$D/app/src/main/java/com/auralis/browser/MainActivity.kt"
          mkdir -p /tmp/st5
          cp "$D/app/src/main/assets/index.html" "$D/app/src/main/java/com/auralis/browser/MainActivity.kt" "$D/app/src/main/AndroidManifest.xml" /tmp/st5/
          echo "Stage 5 applied" >> $GITHUB_STEP_SUMMARY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Build with fallback
        run: |
          F="$D/app/src/main/assets/index.html"
          K="$D/app/src/main/java/com/auralis/browser/MainActivity.kt"
          MF="$D/app/src/main/AndroidManifest.xml"
          OK=0
          for n in 5 4 3 2 1 0; do
            [ -d /tmp/st$n ] || continue
            cp /tmp/st$n/index.html "$F"
            cp /tmp/st$n/MainActivity.kt "$K"
            cp /tmp/st$n/AndroidManifest.xml "$MF"
            if gradle assembleDebug --no-daemon -p "$D"; then
              echo "### Built with stage $n (5 = everything)" >> $GITHUB_STEP_SUMMARY
              OK=1
              break
            fi
            echo "Stage $n failed to build, trying the previous one" >> $GITHUB_STEP_SUMMARY
          done
          [ "$OK" = 1 ]
      - name: Verify icon inside APK
        run: |
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging "$D/app/build/outputs/apk/debug/app-debug.apk" | grep -E "^application:" | tee /tmp/badging.txt
          grep -q "icon='res/" /tmp/badging.txt
          echo "Icon verified: $(cat /tmp/badging.txt)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: {name: Auralis-APK-v4, path: "${{ env.D }}/app/build/outputs/apk/debug/app-debug.apk"}
