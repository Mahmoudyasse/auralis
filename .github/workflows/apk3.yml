          async function links(){const r=await ask(pgLinks);window.__lks=r||[];panel('<h2>🔗 Page links ('+window.__lks.length+')</h2><input type="text" id="lkq" placeholder="Filter links" autocapitalize="off"><div id="lkl">'+lkList('')+'</div>')}
