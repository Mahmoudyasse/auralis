            if(sent.length<3){panel('<h2>📝 Summary</h2><small>Not enough text on this page</small>');return}
            const f={};(txt.toLowerCase().match(/[\p{L}]{4,}/gu)||[]).forEach(w=>{f[w]=(f[w]||0)+1});
            const sc=sent.map((x,i)=>{const w=x.toLowerCase().match(/[\p{L}]{4,}/gu)||[];return [w.reduce((a,b)=>a+(f[b]||0),0)/Math.max(8,w.length),i,x]});
            const top=sc.sort((a,b)=>b[0]-a[0]).slice(0,5).sort((a,b)=>a[1]-b[1]);
