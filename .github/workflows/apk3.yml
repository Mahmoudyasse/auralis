          function homeX(){const m=$('#main');if(!m||m.querySelector('#hx4'))return;const ft=m.querySelector('.ft');if(!ft)return;const d=Math.floor(Date.now()/864e5),n=S.todo.filter(x=>!x.d).length,c=cdv();
            ft.insertAdjacentHTML('beforebegin',`<div id="hx4"><div class="seg" style="justify-content:center;margin:14px 0 8px"><button data-a4="tool_todo">✅ To-do${n?' ('+n+')':''}</button><button data-a4="tool_pom">🍅 Focus</button><button data-a4="toolbox">🧰 Toolbox</button><button data-a4="focus">🎯 Block</button></div>${(c!==null&&S.cd)?`<div class="g w" style="margin-top:8px"><b>${c}</b><small>days until ${esc(S.cd.n)}</small></div>`:''}<div class="g w" style="margin-top:8px"><small>💡 Daily</small><div style="margin-top:4px;line-height:1.6">${esc(QT[d%QT.length])}</div></div></div>`)}
