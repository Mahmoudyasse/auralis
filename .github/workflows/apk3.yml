          function dispatch(e){const a=e.target.closest('[data-a4]');if(!a)return;const v=a.dataset.a4;try{if(H[v]){H[v](a);return}const i=v.indexOf('_');if(i>0){const f=HP[v.slice(0,i)];if(f)f(v.slice(i+1),a)}}catch(err){alert('Error: '+((err&&err.message)||err))}}
